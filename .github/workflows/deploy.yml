name: Deploy to Production

# 推送到 main 分支时自动部署
on:
  push:
    branches:
      - main
  # 也可手动触发
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Hong Kong Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # SSH 进入服务器执行 git pull + docker compose up
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            cd /var/www/shareflow

            echo ">>> 修复目录所有权（排除 data/ 避免破坏 PostgreSQL 文件权限）..."
            sudo chown $USER:$USER /var/www/shareflow
            git config --global --add safe.directory /var/www/shareflow

            echo ">>> 拉取最新代码..."
            git pull origin main

            echo ">>> 重新构建并启动容器..."
            docker compose up -d --build

            echo ">>> 执行数据库迁移（境外实例）..."
            docker compose run --rm migrator-overseas

            echo ">>> 执行数据库迁移（境内实例）..."
            docker compose run --rm migrator-domestic

            echo ">>> 容器状态："
            docker compose ps
