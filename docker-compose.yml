version: '3.8'

services:
  shareflow-api-overseas:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    environment:
      - REGION=overseas
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Default=Host=postgres-overseas;Port=5432;Database=${POSTGRES_DB_OVERSEAS};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Redis__ConnectionString=redis-overseas:6379,password=${REDIS_PASSWORD}
      - Jwt__SecretKey=${JWT_SECRET}
      - MinIO__Endpoint=minio:9000
      - MinIO__AccessKey=${MINIO_ROOT_USER}
      - MinIO__SecretKey=${MINIO_ROOT_PASSWORD}
      - FrontendBaseUrl=${FRONTEND_BASE_URL}
      - Cors__AllowedOrigins__0=${FRONTEND_BASE_URL}
      - Cors__AllowedOrigins__1=http://localhost:5173
    ports:
      - "5001:8080"
    depends_on:
      postgres-overseas:
        condition: service_healthy
      redis-overseas:
        condition: service_started
    networks:
      - shareflow-net
    restart: always

  shareflow-api-domestic:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    environment:
      - REGION=domestic
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Default=Host=postgres-domestic;Port=5432;Database=${POSTGRES_DB_DOMESTIC};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Redis__ConnectionString=redis-domestic:6379,password=${REDIS_PASSWORD}
      - Jwt__SecretKey=${JWT_SECRET}
      - MinIO__Endpoint=minio:9000
      - MinIO__AccessKey=${MINIO_ROOT_USER}
      - MinIO__SecretKey=${MINIO_ROOT_PASSWORD}
      - FrontendBaseUrl=${FRONTEND_BASE_URL}
      - Cors__AllowedOrigins__0=${FRONTEND_BASE_URL}
      - Cors__AllowedOrigins__1=http://localhost:5173
    ports:
      - "5002:8080"
    depends_on:
      postgres-domestic:
        condition: service_healthy
      redis-domestic:
        condition: service_started
    networks:
      - shareflow-net
    restart: always

  postgres-overseas:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_OVERSEAS}
    volumes:
      - ./data/pgdata-overseas:/var/lib/postgresql/data
    networks:
      - shareflow-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  postgres-domestic:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_DOMESTIC}
    volumes:
      - ./data/pgdata-domestic:/var/lib/postgresql/data
    networks:
      - shareflow-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis-overseas:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - shareflow-net
    restart: always

  redis-domestic:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - shareflow-net
    restart: always

  front-end:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    networks:
      - shareflow-net
    depends_on:
      - shareflow-api-overseas
      - shareflow-api-domestic
    restart: always

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio-data:/data
    networks:
      - shareflow-net
    restart: always

networks:
  shareflow-net:
    driver: bridge
